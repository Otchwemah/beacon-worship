<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Beacon Worship - Loading</title>

        <link rel="stylesheet" href="global.css" />

        <style>
            :root {
                --radius: 5px;
                --loader-height: 3px;

                /* Beacon Worship brand palette, sampled from the selected logo */
                --brand-navy: #121a25;
                --brand-navy-deep: #0b1119;
                --brand-gold: #dbac64;
                --brand-teal: #479495;
            }

            main {
                background-color: var(--brand-navy);
                background: linear-gradient(140deg, var(--brand-navy) 20%, var(--brand-navy-deep));
                width: 100%;
                height: 100%;
                border-radius: var(--radius);

                display: flex;
                flex-direction: column;
                gap: 10px;
                justify-content: center;
                align-items: center;
                -webkit-app-region: drag;

                overflow: hidden;
            }

            /* Beacon Worship: the selected logo is a square lockup, so the old
               42%-width / full-height object-fit:cover photo box would crop it badly.
               Centred mark + title instead. Mark is the icon-only crop (no wordmark),
               so it stays crisp at this size and doesn't duplicate the heading. */
            .mark {
                width: 92px;
                height: 92px;
                object-fit: contain;
                border-radius: 21px;
                /* subtle lift off the gradient */
                box-shadow: 0 6px 22px rgb(0 0 0 / 0.45);
            }

            .v {
                opacity: 0.4;
                font-size: 0.85em;
            }

            h1 {
                font-size: 1.9em;
                margin: 0;
                letter-spacing: 0.02em;
                /* echoes the wordmark: white "BEACON", gold "WORSHIP" */
                background: -webkit-linear-gradient(100deg, #ffffff 35%, var(--brand-gold));
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .loader {
                --margin: 1.5px;
                background-color: rgb(255 255 255 / 0.08);
                margin: 0 var(--margin);
                border-top-left-radius: 40px;
                border-top-right-radius: 40px;

                position: absolute;
                top: 0;
                width: calc(100% - (var(--margin) * 2));
                height: var(--loader-height);

                overflow: hidden;
            }

            .loader span:before {
                content: "";
                position: absolute;
                height: 100%;
                background-color: var(--brand-gold);
                animation: first 1.8s infinite ease-out;
            }

            .loader span:after {
                content: "";
                position: absolute;
                height: 100%;
                background-color: var(--brand-teal);
                animation: second 1.8s infinite ease-in;
            }

            @keyframes first {
                0% {
                    inset-inline-start: -100%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }

            @keyframes second {
                0% {
                    inset-inline-start: -150%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }
        </style>
    </head>
    <body>
        <div class="loader">
            <span></span>
        </div>

        <main>
            <img class="mark" src="./assets/beacon-worship-mark.png" alt="Beacon Worship" draggable="false" onerror="this.style.display = 'none'" />

            <h1>Beacon Worship</h1>
            <p class="v">v<span class="version">0.0.0</span></p>
        </main>

        <script>
            const { ipcRenderer } = require("electron")

            ipcRenderer.send("MAIN", { channel: "VERSION" })
            ipcRenderer.once("MAIN", (e, msg) => {
                if (msg.channel !== "VERSION" || !msg.data) return
                document.querySelector(".version").innerHTML = msg.data
            })
        </script>
    </body>
</html>
