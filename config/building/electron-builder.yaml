appId: app.freeshow
productName: Beacon Worship
artifactName: BeaconWorship-${version}-${arch}.${ext}

# WIDEVINE
# Use castlabs electron builds to get widevine support
# electronDownload:
#     mirror: https://github.com/castlabs/electron-releases/releases/download/

files:
    - build/electron/**
    - build/types/**
    - public/**
    - "!node_modules/@napi-rs"
    - "!**/node_modules/*/{CHANGELOG*,README*,test*,example*,docs}"
    - "!**/node_modules/*/{*.d.ts,*.ts,*.map}"
    - "!**/node_modules/{@types,typescript}/**"
    - "!**/node_modules/**/*.{pdb,iobj,ipdb,obj,lib,exp,a,o,c,cc,cpp,h,hpp,gyp*,vcxproj*,filters,sln}"
    - "!**/node_modules/**/prebuild/node-v*"
    - "!**/node_modules/grandiose/ndi/**"
    - "!**/node_modules/osr-capture/**/on12_harness.exe"

extraResources:
    - from: node_modules/slideshow/
      to: slideshow
      filter:
          - connector-*

# windows

win:
    target: NSIS
    # Beacon Worship: use the generated multi-size .ico (16/24/32px are rendered with
    # tighter padding so the mark stays legible in the title bar and taskbar) instead
    # of letting electron-builder derive one from the PNG. Regenerate with
    # scripts/branding/generate-brand-assets.py
    icon: build/public/icon.ico
    files:
        - "!**/node_modules/openmediatransport/lib/{macos,linux-*,win-arm64}/**"
    asarUnpack:
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/libspotifyctl/**/*"
        - "**/node_modules/openmediatransport/**"
        - "**/node_modules/sherpa-onnx-*/**"
    azureSignOptions:
        publisherName: Live Church Solutions
        endpoint: https://wus2.codesigning.azure.net/
        certificateProfileName: FreeShow
        codeSigningAccountName: FreeShow

# linux

linux:
    files:
        - "!**/node_modules/openmediatransport/lib/{macos,win-*}/**"
    asarUnpack:
        - "**/node_modules/grandiose/**"
        - "**/node_modules/openmediatransport/**"
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/libltc-wrapper/**/*"
        - "**/node_modules/sherpa-onnx-*/**"
    category: AudioVideo
    target:
        - AppImage
        - deb
        - rpm
    icon: build/public

deb:
    depends:
        - libfontconfig1
        - uuid-runtime
        - libltc11
        - libavahi-client3
        - avahi-daemon

# macos

mac:
    # Beacon Worship: use the generated .icns, which follows Apple's icon grid
    # (1024 canvas / 824 rounded content tile, transparent margin) so the app sits
    # natively in the Dock. Revert to icon.png here for a full-square macOS icon.
    icon: build/public/icon.icns
    files:
        - "!**/node_modules/openmediatransport/lib/{linux-*,win-*}/**"
    asarUnpack:
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/openmediatransport/**"
        - "**/node_modules/sherpa-onnx-*/**"
    target:
        - target: dmg
          arch:
              - x64
              - arm64
        - target: zip
          arch:
              - x64
              - arm64
    category: public.app-category.utilities
    hardenedRuntime: true
    gatekeeperAssess: false
    notarize: false
    entitlements: scripts/macos/entitlements.mac.plist
    entitlementsInherit: scripts/macos/entitlements.mac.plist
    extendInfo:
        NSMicrophoneUsageDescription: Please give access to your microphone if you want to use it for input.
        NSCameraUsageDescription: Please give access to your camera if you want to use it for input.
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true

afterSign: scripts/macos/notarize.js

dmg:
    background: build/public/dmg.png
    sign: false
    contents:
        - x: 140
          y: 150
        - x: 400
          y: 150
          type: link
          path: /Applications
