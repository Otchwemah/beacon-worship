name: Validation

# Beacon Worship validation workflow for the customized branch.
# Separate from Release: this workflow only checks and builds; it never publishes artifacts,
# creates releases, or uses signing/publishing credentials.
on:
    workflow_dispatch:
    push:
        branches:
            - "beacon-worship/custom"
    pull_request:
        branches:
            - "beacon-worship/custom"
            - "main"

permissions:
    contents: read

concurrency:
    group: validation-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        name: Unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install Linux libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev libegl1-mesa-dev libgles2-mesa-dev --fix-missing

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test:unit
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

    svelte-check:
        name: Svelte check (advisory)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install Linux libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev libegl1-mesa-dev libgles2-mesa-dev --fix-missing

            - name: Install dependencies
              run: npm ci

            # svelte-check has a known pre-existing backlog in this codebase. Run it on CI
            # (where memory is sufficient) and report the result, but do not block the
            # validation gate until that backlog is cleared. Flip continue-on-error off then.
            - name: Type-check (svelte)
              run: npm run test:svelte
              continue-on-error: true
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

    production-build:
        name: Production build (${{ matrix.os }})
        needs: unit-tests
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45

        strategy:
            fail-fast: false
            matrix:
                os:
                    - windows-latest
                    - macos-latest
                    - ubuntu-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            # node-gyp native dependencies are more reliable with Python 3.11 on macOS.
            - name: Install Python 3.11 (macOS)
              if: runner.os == 'macOS'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Linux libraries
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev libegl1-mesa-dev libgles2-mesa-dev --fix-missing

            - name: Install dependencies
              run: npm ci

            # Production build only (prebuild + frontend/servers/electron + postbuild).
            # This does not run electron-builder publish or create a release.
            - name: Build app
              run: npm run build
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
