name: Validation

# Beacon Worship validation workflow for the customized branch.
# Separate from Release: this workflow only checks and builds; it never publishes artifacts,
# creates releases, or uses signing/publishing credentials.
on:
    workflow_dispatch:
    push:
        branches:
            - "beacon-worship/custom"
    pull_request:
        branches:
            - "beacon-worship/custom"
            - "main"

permissions:
    contents: read

concurrency:
    group: validation-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        name: Unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install Linux libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev libegl1-mesa-dev libgles2-mesa-dev --fix-missing

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test:unit
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

    svelte-check:
        name: Svelte check (advisory)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install Linux libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev libegl1-mesa-dev libgles2-mesa-dev --fix-missing

            - name: Install dependencies
              run: npm ci

            # svelte-check has a known pre-existing backlog in this codebase. Run it on CI
            # (where memory is sufficient) and report the result, but do not block the
            # validation gate until that backlog is cleared. Flip continue-on-error off then.
            - name: Type-check (svelte)
              run: npm run test:svelte
              continue-on-error: true
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

    production-build:
        name: Production build (${{ matrix.os }})
        needs: unit-tests
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45

        strategy:
            fail-fast: false
            matrix:
                os:
                    # Pinned to windows-2022 on purpose, matching the Release workflow.
                    # This app has four node-gyp native deps (grandiose, osr-capture,
                    # libltc-wrapper, better-sqlite3). On the newer windows-latest image
                    # node-gyp cannot parse the Visual Studio 18 version string and aborts
                    # with "Could not find any Visual Studio installation to use".
                    - windows-2022
                    - macos-latest
                    - ubuntu-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            # node-gyp native dependencies are more reliable with Python 3.11 on macOS.
            - name: Install Python 3.11 (macOS)
              if: runner.os == 'macOS'
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Install Linux libraries
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev libegl1-mesa-dev libgles2-mesa-dev --fix-missing

            - name: Install dependencies
              run: npm ci
              env:
                  # Belt-and-braces for node-gyp on Windows: tell it explicitly which
                  # MSVC toolchain to use instead of relying on version auto-detection.
                  npm_config_msvs_version: ${{ runner.os == 'Windows' && '2022' || '' }}

            # Production build only (prebuild + frontend/servers/electron + postbuild).
            # This does not run electron-builder publish or create a release.
            - name: Build app
              run: npm run build
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            # Surface the real compiler/native-dep error in the job log instead of only
            # npm's generic "exit code 1" summary.
            - name: Dump npm debug log on failure
              if: failure()
              shell: bash
              run: |
                  log_dir="$(npm config get cache)/_logs"
                  latest="$(ls -t "$log_dir"/*.log 2>/dev/null | head -1 || true)"
                  if [ -n "$latest" ]; then
                    echo "=== tail of $latest ==="
                    tail -n 150 "$latest"
                  else
                    echo "No npm debug log found in $log_dir"
                  fi

    # Repeatable regression checks against the real built app: dropdowns, keyboard controls,
    # live/audience outputs, Bible navigation and hymn selection. Windows first, then macOS.
    # Still validation-only - no publishing, no signing, no credentials.
    regression:
        name: Regression (${{ matrix.os }})
        needs: unit-tests
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40

        # BLOCKING as of run #9 (b533f7c8): all 10 specs passed on both windows-2022 and
        # macos-latest, both jobs green, both report artifacts uploaded. A failing regression
        # spec now fails the Validation run.
        #
        # The spec step itself keeps continue-on-error so the digest, artifact upload and
        # step-outcome table still run on failure; the final "Mark job failed" step restores
        # the true exit status. Diagnostics upload stays non-fatal on purpose.

        strategy:
            fail-fast: false
            matrix:
                # windows-2022 for the same node-gyp/MSVC reason as production-build.
                os:
                    - windows-2022
                    - macos-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install Python 3.11 (macOS)
              if: runner.os == 'macOS'
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Install dependencies
              id: deps
              run: npm ci
              env:
                  npm_config_msvs_version: ${{ runner.os == 'Windows' && '2022' || '' }}

            # The regression specs launch the built app (package.json main -> build/electron).
            - name: Build app
              id: build
              run: npm run build
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            # No `playwright install` needed: _electron.launch() drives the Electron binary
            # from node_modules, not a Playwright-downloaded browser.
            # `continue-on-error` on the job means a red run can still look green overall, so
            # capture the outcome explicitly and surface it in the run summary.
            - name: Run regression checks
              id: regression
              continue-on-error: true
              run: npm run test:regression
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            # Print failing spec names + first error lines as plain text into the log AND the
            # job summary, so the failure can be read from a screenshot of the Summary page
            # without downloading/unzipping the report artifact.
            - name: Regression failure digest
              id: digest
              if: always()
              shell: bash
              run: node scripts/testing/regressionDigest.js

            - name: Report regression outcome
              if: always()
              shell: bash
              run: |
                  outcome="${{ steps.regression.outcome }}"
                  echo "### Regression (${{ matrix.os }}): ${outcome}" >> "$GITHUB_STEP_SUMMARY"
                  if [ "$outcome" != "success" ]; then
                    echo "" >> "$GITHUB_STEP_SUMMARY"
                    echo "Specs did not all pass. Download the \`regression-report-${{ matrix.os }}\` artifact for traces, screenshots and video." >> "$GITHUB_STEP_SUMMARY"
                  fi
                  echo "regression outcome: ${outcome}"

            # Uploading diagnostics must never fail the gate: in run #8 all 10 specs passed on
            # both platforms, yet the macOS job went red after the tests, with only one of the
            # two artifacts uploaded. A report-upload problem is not a product regression.
            - name: Upload regression report
              id: upload
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v5
              with:
                  name: regression-report-${{ matrix.os }}
                  path: test-output/
                  retention-days: 14
                  if-no-files-found: ignore
                  overwrite: true

            # Explain a red job from the Summary alone. The Playwright digest only covers spec
            # results, so a failing install/build/upload step was previously invisible there.
            - name: Step outcome diagnostics
              if: always()
              shell: bash
              run: |
                  {
                    echo "#### Step outcomes (${{ matrix.os }})"
                    echo ""
                    echo "| Step | Outcome |"
                    echo "| --- | --- |"
                    echo "| Install dependencies | ${{ steps.deps.outcome }} |"
                    echo "| Build app | ${{ steps.build.outcome }} |"
                    echo "| Run regression checks | ${{ steps.regression.outcome }} |"
                    echo "| Failure digest | ${{ steps.digest.outcome }} |"
                    echo "| Upload report | ${{ steps.upload.outcome }} |"
                    echo ""
                    echo "Job status so far: ${{ job.status }}"
                  } >> "$GITHUB_STEP_SUMMARY"

            # Fail the job when the specs failed, so the job badge is truthful. The job-level
            # continue-on-error keeps the overall run green while this gate is advisory.
            - name: Mark job failed if regression failed
              if: steps.regression.outcome != 'success'
              shell: bash
              run: |
                  echo "Regression specs failed on ${{ matrix.os }}"
                  exit 1
